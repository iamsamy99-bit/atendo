[build]
  command = "npm run build"
  publish = "dist"

# Security headers — all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options             = "SAMEORIGIN"
    X-Content-Type-Options      = "nosniff"
    X-XSS-Protection            = "1; mode=block"
    Referrer-Policy             = "strict-origin-when-cross-origin"
    Strict-Transport-Security   = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy          = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy     = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.cal.com https://client.crisp.chat https://elevenlabs.io; frame-src https://app.cal.com https://cal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://app.cal.com https://cal.com https://client.crisp.chat wss://client.relay.crisp.chat https://api.elevenlabs.io wss://*.elevenlabs.io; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# Cache Vite-hashed assets forever (filenames change on content change)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache HTML so updates go live immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
